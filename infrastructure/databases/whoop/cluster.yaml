apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: whoop-postgres
  namespace: whoop
spec:
  # A single node provides persistence, but no HA or off-node backup.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: whoop
      owner: whoop
      secret:
        name: whoop-postgres-credentials
  # CNPG creates internal ClusterIP services; use whoop-postgres-rw for writes.
  # The scraper applies its own embedded SQLx migrations on startup.
  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: "128MB"
    pg_hba:
      - hostnossl all all all reject
  storage:
    storageClass: local-path
    # local-path does not enforce this capacity or support online expansion.
    size: 10Gi
  affinity:
    nodeSelector:
      kubernetes.io/hostname: forge
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    tls:
      enabled: true
