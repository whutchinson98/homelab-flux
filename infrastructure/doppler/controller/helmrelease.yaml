apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: doppler-operator
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: doppler-operator
  # This chart creates and hardcodes doppler-operator-system for its workloads.
  # Keep Helm's release storage in flux-system and let Helm own that namespace.
  chart:
    spec:
      chart: doppler-kubernetes-operator
      version: "1.7.2"
      sourceRef:
        kind: HelmRepository
        name: doppler
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
