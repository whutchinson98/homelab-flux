apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - name: loki
  chart:
    spec:
      chart: alloy
      version: "1.13.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: alloy-values
