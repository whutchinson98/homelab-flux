apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - prometheusrule.yaml
  - rbac.yaml
configMapGenerator:
  - name: alloy-values
    files:
      - values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: alloy-config
    files:
      - config.alloy
generatorOptions:
  disableNameSuffixHash: true
