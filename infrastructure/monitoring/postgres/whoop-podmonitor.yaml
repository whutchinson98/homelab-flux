apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: whoop-postgres
  namespace: whoop
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: whoop-postgres
  podMetricsEndpoints:
    - port: metrics
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: whoop-postgres-ca
            key: ca.crt
        serverName: whoop-postgres-rw
