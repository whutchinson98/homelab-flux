fullnameOverride: loki
deploymentMode: Monolithic
serviceAccount:
  automountServiceAccountToken: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    max_query_parallelism: 2
    tsdb_max_query_parallelism: 2
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    retention_delete_worker_count: 10
  ingester:
    wal:
      enabled: true
      dir: /var/loki/wal
      replay_memory_ceiling: 256MB
  querier:
    max_concurrent: 2
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  sidecar: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
    # Preserve log data if the StatefulSet is removed or scaled down.
    enableStatefulSetAutoDeletePVC: false

# Local storage and a single process suit this single-node homelab.
# local-path capacity is not a quota; retention and node disk alerts matter.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
sidecar:
  rules:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  rules:
    enabled: true
    labels:
      release: kube-prometheus-stack
  alerts:
    enabled: true
    labels:
      release: kube-prometheus-stack
    # Chart 18.16.0 defines this name twice with identical alert labels.
    # Combine its two conditions below so Prometheus sees one alert identity.
    disabled:
      LokiCompactorHasNotSuccessfullyRunCompaction: true
  additionalPrometheusRules:
    compactor:
      groups:
        - name: loki-compactor-health
          rules:
            - alert: LokiCompactorHasNotSuccessfullyRunCompaction
              expr: |
                (min by (namespace) (
                  time() - (loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds{namespace="monitoring", app_instance="loki"} > 0)
                ) > 10800)
                or
                (max by (namespace) (
                  max_over_time(loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds{namespace="monitoring", app_instance="loki"}[3h])
                ) == 0)
              for: 1h
              labels:
                severity: critical
              annotations:
                summary: Loki compaction has not succeeded in three hours
                description: Check the Loki compactor and node disk space; log retention may not be progressing.
