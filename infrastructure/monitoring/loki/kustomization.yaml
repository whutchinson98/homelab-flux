apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: loki-values
    files:
      - values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: grafana-loki-datasource
    files:
      - loki.yaml=datasource.yaml
    options:
      labels:
        grafana_datasource: "1"
generatorOptions:
  disableNameSuffixHash: true
