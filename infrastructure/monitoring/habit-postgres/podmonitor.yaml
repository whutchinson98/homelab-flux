apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: habit-postgres
  namespace: habit-tracker
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: habit-postgres
  podMetricsEndpoints:
  - port: metrics
    scheme: https
    tlsConfig:
      ca:
        secret:
          name: habit-postgres-ca
          key: ca.crt
      serverName: habit-postgres-rw
