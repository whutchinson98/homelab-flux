apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - datasource.yaml
configMapGenerator:
  - name: whoop-grafana-dashboard
    namespace: monitoring
    files:
      - whoop-overview.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
