apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-certificates
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: cert-manager-issuers
    - name: monitoring
  path: ./infrastructure/monitoring/certificates
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
