apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-storage
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/home-assistant/storage
  # Retain the namespace and user data if this application is removed from Git.
  prune: false
  deletionPolicy: Orphan
  # local-path PVC binding waits for the application pod to be scheduled.
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-certificate
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: cert-manager-issuers
    - name: home-assistant-storage
  path: ./apps/home-assistant/certificate
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  dependsOn:
    - name: home-assistant-storage
    - name: home-assistant-certificate
    - name: routing-traefik
  path: ./apps/home-assistant/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
