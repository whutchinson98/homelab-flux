apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logging-loki
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  dependsOn:
    - name: monitoring
  path: ./infrastructure/monitoring/loki
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logging-alloy
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: logging-loki
  path: ./infrastructure/monitoring/alloy
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
