apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-routes
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: routing-traefik
    - name: monitoring-certificates
  path: ./infrastructure/monitoring/routes
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
