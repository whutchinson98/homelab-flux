apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: whoop-secrets
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  # The setup helper resumes this after adding the encrypted service token.
  suspend: false
  dependsOn:
    - name: doppler-operator
    - name: whoop-postgres
  path: ./apps/whoop-scraper/secrets
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: secrets.doppler.com/v1alpha1
      kind: DopplerSecret
      current: >-
        status.conditions.exists(c,
          c.type == 'secrets.doppler.com/SecretSyncReady' && c.status == 'True')
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
