apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: habit-tracker-ghcr
  namespace: habit-tracker
spec:
  tokenSecret:
    name: habit-tracker-doppler-token
    namespace: habit-tracker
  project: habit-tracker
  config: prd
  resyncSeconds: 60
  secrets:
  - GHCR_DOCKERCONFIG
  managedSecret:
    name: ghcr-auth
    namespace: habit-tracker
    type: kubernetes.io/dockerconfigjson
  processors:
    GHCR_DOCKERCONFIG:
      type: plain
      asName: .dockerconfigjson
