apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: habit-tracker
  namespace: habit-tracker
spec:
  tokenSecret:
    name: habit-tracker-doppler-token
    namespace: habit-tracker
  project: habit-tracker
  config: prd
  resyncSeconds: 60
  secrets:
  - DATABASE_URL
  - APP_TIMEZONE
  managedSecret:
    name: habit-tracker-env
    namespace: habit-tracker
    type: Opaque
