apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: habit-tracker
  namespace: habit-tracker
  annotations:
    kubernetes.io/ingress.class: tailscale
spec:
  entryPoints:
  - tailscale
  routes:
  - match: Host(`habits.thehutchery.com`)
    kind: Rule
    services:
    - name: habit-tracker
      port: 3000
  tls:
    secretName: habit-tracker-tls
