apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: whoop-ghcr
  namespace: whoop
spec:
  tokenSecret:
    name: whoop-doppler-token
    namespace: whoop
  project: whoop-scraper
  config: prd
  resyncSeconds: 60
  secrets:
    - GHCR_DOCKERCONFIG
  processors:
    GHCR_DOCKERCONFIG:
      type: plain
      asName: .dockerconfigjson
  managedSecret:
    name: ghcr-auth
    namespace: whoop
    type: kubernetes.io/dockerconfigjson
