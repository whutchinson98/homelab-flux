apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: whoop-scraper
  namespace: whoop
spec:
  tokenSecret:
    name: whoop-doppler-token
    namespace: whoop
  project: whoop-scraper
  config: prd
  resyncSeconds: 60
  # Keep registry credentials out of the application's environment Secret.
  secrets:
    - DATABASE_URL
    - WHOOP_CLIENT_ID
    - WHOOP_CLIENT_SECRET
    - WHOOP_TIMEZONE
  # Doppler owns this Secret; do not also declare it as a Flux/SOPS Secret.
  managedSecret:
    name: whoop-scraper-env
    namespace: whoop
    type: Opaque
